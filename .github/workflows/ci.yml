name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A fresh clone resolves from PyPI; this keeps it that way if a local path
  # source is ever added, so CI proves the published dependencies suffice.
  UV_NO_SOURCES: "1"

jobs:
  check:
    name: Lint, offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --no-sources --all-extras
      - name: Ruff (lint)
        run: uv run --no-sources ruff check .
      - name: Ruff (format)
        run: uv run --no-sources ruff format --check .
      - name: Offline tests
        run: uv run --no-sources pytest -q
      - name: Entry points start without the dev checkouts
        run: |
          uv run --no-project github_worker.py --help > /dev/null
          uv run --no-project serve.py --help > /dev/null

  catalog:
    name: Catalog metadata (vgi-lint, structural)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --no-sources
      # Structural tier only: no network, so it is safe on every push.
      - name: vgi-lint (structural)
        run: >
          uvx --no-sources --from vgi-lint-check==0.81.1 vgi-lint lint "uv run --no-sources github_worker.py"
          --no-execute --no-check-links --audit-waivers --fail-on warning
