[project]
name = "vgi-github"
dynamic = ["version"]
description = "A read-only VGI (Vector Gateway Interface) worker exposing GitHub REST and GraphQL to DuckDB/SQL"
readme = "README.md"
license = "MIT"
authors = [{ name = "Query Farm", email = "hello@query.farm" }]
keywords = ["vgi", "duckdb", "arrow", "github", "sql", "repositories", "issues"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    # The SDK needs its pinned DuckDB 1.5 filter evaluator inside the worker.
    # Native SQL tests use Haybarn 2.0 separately as the VGI 3.3 client.
    "vgi-python[http,duckdb]>=0.51.0",
    "httpx>=0.28.1",
    "graphql-core>=3.2.6,<3.3",
]

[project.optional-dependencies]
serve = ["vgi-python[http,duckdb,oauth]>=0.51.0", "vgi-rpc[sentry]>=0.53.1"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Pinned to a minor: the rule set is version-dependent, so an unpinned ruff
    # means CI can fail on a commit that was clean locally.
    "ruff>=0.17.2,<0.18",
    # Drives a real ATTACH in tests/test_end_to_end.py.
    "haybarn>=2.0.0rc11,<2.1",
    # DuckDB materializes TIMESTAMP WITH TIME ZONE through pytz; without it a
    # scan that returns one fails at fetch time, not at bind.
    "pytz>=2026.5",
]

[project.urls]
Homepage = "https://query.farm"
Documentation = "https://query.farm/vgi/"
Repository = "https://github.com/Query-farm/vgi-github"
Issues = "https://github.com/Query-farm/vgi-github/issues"

[project.scripts]
vgi-github = "vgi_github.worker:main"
vgi-github-http = "vgi_github.worker:main_http"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "vgi_github/__init__.py"

[tool.ruff]
line-length = 110
target-version = "py313"

# Selected explicitly rather than left to the default set, which changes between
# ruff releases, so CI and a developer's shell cannot disagree about a commit.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit the real GitHub API; opt in with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: hits the real GitHub API over the network"]
